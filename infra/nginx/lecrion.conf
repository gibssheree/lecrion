# infra/nginx/lecrion.conf
#
# Serves the pos-web SPA build and reverse-proxies API + realtime traffic
# to the `api` container (Docker Compose service name, port 3000).
# Copied into the web image at build time — see infra/docker/Dockerfile.web.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO realtime — requires Upgrade/Connection headers for WebSocket
    location /ws/realtime {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # SPA — client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the shell/service-worker; assets are content-hashed by Vite
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
