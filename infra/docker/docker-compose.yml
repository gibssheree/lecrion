version: "3.9"

# Phase 6 Docker Compose — Hardened
# NestJS API + Worker + pos-web (nginx) + SQLite (file-based)
#
# Development: docker compose -f infra/docker/docker-compose.yml up
# Production:  use separate orchestration with secrets manager
#
# Only `web` publishes a host port — it's the sole public entry point.
# `api`/`worker` are reachable from `web` only via the compose-internal
# network (service name `api`, port 3000), so the raw API port is never
# exposed directly on the host.

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      AUTH_DISABLED: "false"
    volumes:
      - lecrion_db:/app/database
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      OUTBOX_POLL_MS: "5000"
      READ_MODEL_INTERVAL_MS: "60000"
    volumes:
      - lecrion_db:/app/database
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  lecrion_db:
    driver: local
